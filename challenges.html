<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wave Challenges</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        🌊 <span>Physics Lab</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="simulation.html">Simulation</a>
        <a href="notes.html">Notes</a>
        <a href="challenges.html" class="active">Challenges</a>
        <a href="quiz.html">Quiz</a>
    </nav>

</header>


<main class="challenge-page">

    <div class="page-heading">

        <div>

            <div class="badge">
                STAGE 3 — TEST YOUR UNDERSTANDING
            </div>

            <h1>Wave Motion Challenges</h1>

            <p>
                Apply what you learned from the simulation.
            </p>

        </div>

    </div>


    <section class="challenge-container">

        <div class="challenge-top">

            <span id="challengeNumber">
                Challenge 1 of 5
            </span>

            <span>
                Score: <strong id="challengeScore">0</strong>
            </span>

        </div>


        <div class="progress-bar">

            <div
                id="challengeProgress"
                class="progress-fill">
            </div>

        </div>


        <h2 id="challengeTitle">
            Challenge 1
        </h2>


        <div class="question-box">

            <p id="challengeQuestion">
                Loading question...
            </p>

        </div>


        <div
            id="challengeOptions"
            class="challenge-options">
        </div>


        <div
            id="challengeFeedback"
            class="challenge-feedback">
        </div>


        <button
            id="nextChallenge"
            class="primary-btn next-btn">

            Next Challenge →

        </button>

    </section>

</main>


<footer>

    <p>
        🌊 Physics Lab • Wave Motion
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
