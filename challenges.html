<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Wave Challenges</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">

    <div class="logo">
        🌊 <span>Physics Lab</span>
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="simulation.html">
            Simulation
        </a>

        <a href="notes.html">
            Notes
        </a>

        <a
            href="challenges.html"
            class="active">
            Challenges
        </a>

        <a href="quiz.html">
            Quiz
        </a>

    </nav>

</header>


<main class="challenge-page">


    <div class="page-heading center">

        <div class="badge">
            MISSION MODE
        </div>

        <h1>
            🎯 Wave Challenges
        </h1>

        <p>
            Apply wave concepts to solve physics problems.
        </p>

    </div>


    <div class="challenge-container">


        <div class="challenge-progress">

            <span id="challengeNumber">
                Challenge 1 of 5
            </span>

        </div>


        <div class="progress-bar">

            <div
                id="challengeProgress">
            </div>

        </div>


        <div class="challenge-card">


            <div class="challenge-icon">
                🌊
            </div>


            <h2 id="challengeTitle">
                Challenge 1
            </h2>


            <p id="challengeQuestion">
            </p>


            <div
                id="challengeOptions"
                class="challenge-options">
            </div>


            <div
                id="challengeFeedback"
                class="feedback">
            </div>


            <button
                id="nextChallenge"
                class="primary-btn"
                style="display:none;">

                Next Challenge →

            </button>

        </div>


        <div class="score-card">

            <span>
                YOUR SCORE
            </span>

            <strong id="challengeScore">
                0
            </strong>

            <small>
                points
            </small>

        </div>

    </div>

</main>


<footer>

    <p>
        🌊 Physics Lab • Challenge Your Understanding
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
